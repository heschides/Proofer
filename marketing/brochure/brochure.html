<!doctype html>
<meta charset="utf-8">
<title>Sati — Workflow Promotional Brochure</title>
<!--
  SOURCE OF TRUTH for output/pdf/Sati_Workflow_Promotional_Brochure.pdf.
  Each slide is one 960x540pt <svg> using the PDF's own coordinate system, so a number
  here is the number the PDF gets. Text is real text and stays selectable.
  Build: powershell -ExecutionPolicy Bypass -File scripts/build-brochure.ps1
-->
<style>
  @page { size: 960pt 540pt; margin: 0; }
  html, body { margin: 0; padding: 0; background: #fff; }
  .slide { display: block; width: 960pt; height: 540pt; break-after: page; }
  .slide:last-of-type { break-after: auto; }
  text { white-space: pre; }
  @media screen {
    body { background: #45464e; padding: 24px; }
    .slide { margin: 0 auto 24px; box-shadow: 0 6px 28px rgba(0,0,0,.45); background: #fff; }
  }
</style>

  <text x="44" y="44" font-family="'Segoe UI', system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#ad3427">THE FIRST BILLING GATE</text>

  <text x="44" y="103" font-family="'Segoe UI', system-ui, sans-serif" font-size="30" font-weight="700" fill="#13233d">Overdue items make work unbillable. The note stops here.</text>
  <text x="44" y="147" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="400" fill="#56657a">When a required form is overdue, Sati names it - PCP, comprehensive assessment, reclassification, safety plan - and holds the note</text>
  <text x="44" y="166" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="400" fill="#56657a">at submission rather than letting it travel. You see exactly what to fix, and no supervisor reviews work that could never be billed.</text>

  <text x="60" y="470" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" fill="#ad3427">THE GATE DOES NOT HIDE THE PROBLEM.</text>
  <text x="60" y="486" font-family="'Segoe UI', system-ui, sans-serif" font-size="10.5" font-weight="400" fill="#1c2a3f">The gate names the problem, so the team can fix it upstream.</text>
  <text x="558.2009" y="476" font-family="'Segoe UI', system-ui, sans-serif" font-size="7.5" font-weight="400" fill="#7b8798">Billing and 837P capabilities are an early-stage workflow and require payer validation before live submission.</text>

  <text x="44" y="44" font-family="'Segoe UI', system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#427a4a">SUPERVISION AT THE SPEED OF THE WORK</text>

<script>
// Layout guard. SVG text does not wrap, so a lengthened line runs silently off the slide or
// under an image instead of reflowing. Open this file in a browser and check the console, or
// call checkLayout() there for the list. Defining it costs the PDF build nothing.
function checkLayout() {
  const problems = [];

  // Reordering slides means touching data-slide, the footer number and the gradient ids in
  // step. Check they agree, so a slide that is out of step says so instead of shipping.
  const ids = new Set();
  document.querySelectorAll('svg.slide').forEach((svg, i) => {
    const position = i + 1;
    if (+svg.getAttribute('data-slide') !== position)
      problems.push(`position ${position} is labelled data-slide="${svg.getAttribute('data-slide')}"`);
    const footer = [...svg.querySelectorAll('text')].find(t => t.getAttribute('x') === '907.3721');
    if (footer && footer.textContent !== String(position).padStart(2, '0'))
      problems.push(`position ${position} has footer number "${footer.textContent}"`);
    svg.querySelectorAll('[id]').forEach(e => {
      if (ids.has(e.id)) problems.push(`duplicate id "${e.id}" on slide ${position}`);
      ids.add(e.id);
    });
  });

  document.querySelectorAll('svg.slide').forEach(svg => {
    const slide = svg.getAttribute('data-slide');
    const blocks = [...svg.querySelectorAll('image,rect')].map(e => ({
      x: +e.getAttribute('x') || 0, y: +e.getAttribute('y') || 0,
      w: +e.getAttribute('width') || 0, h: +e.getAttribute('height') || 0,
      fill: e.getAttribute('fill') || ''
    })).filter(b => b.w > 120 && b.w < 950 && !b.fill.startsWith('url('));

    svg.querySelectorAll('text').forEach(t => {
      const size = +t.getAttribute('font-size');
      const w = t.getComputedTextLength();
      const x = +t.getAttribute('x'), y = +t.getAttribute('y');
      const left = t.getAttribute('text-anchor') === 'middle' ? x - w / 2 : x;
      const right = left + w, top = y - size * 0.78, bottom = y + size * 0.25;
      const snippet = t.textContent.slice(0, 46);
      if (right > 916.5) problems.push(`slide ${slide}: past the right edge by ${(right - 916).toFixed(1)}pt | "${snippet}"`);
      blocks.forEach(b => {
        if (right > b.x + 2 && left < b.x + b.w - 2 && bottom > b.y + 2 && top < b.y + b.h - 2 && b.x > left + 4)
          problems.push(`slide ${slide}: runs under the block at x=${b.x} by ${(right - b.x).toFixed(1)}pt | "${snippet}"`);
      });
    });
  });
  return problems;
}
window.__layoutProblems = checkLayout();
if (window.__layoutProblems.length) console.warn('Brochure layout problems:\n' + window.__layoutProblems.join('\n'));
</script>
